[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "withaq"
version = "0.2.0"
description = "WITHAQ reproducible containment and data-revocation simulation"
requires-python = ">=3.12"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0", "pydantic==2.13.5", "SQLAlchemy==2.1.3", "psycopg[binary]==3.3.6", "alembic==1.20.0", "PyYAML==6.0.3", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["withaq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
