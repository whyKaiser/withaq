[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "withaq"
version = "0.1.0"
description = "WITHAQ reproducible containment and data-revocation simulation"
requires-python = ">=3.12"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0", "pydantic==2.13.5"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["withaq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
