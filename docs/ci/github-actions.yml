name: Verify simulation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest
      - run: npm --prefix apps/console ci --ignore-scripts
      - run: npm --prefix apps/console run build
      - run: python scripts/export_evidence.py
